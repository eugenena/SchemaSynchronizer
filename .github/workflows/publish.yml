name: Publish to Maven Central

on:
  push:
    tags: ["v1.0.0"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schema_applier_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schema_applier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: schema_synchronizer_test
          MARIADB_USER: schema_sync
          MARIADB_PASSWORD: schema_sync
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: schema_synchronizer_test
          MYSQL_USER: schema_sync
          MYSQL_PASSWORD: schema_sync
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Verify tag matches Maven version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          test "${RELEASE_VERSION#v}" = "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Verify and publish
        run: >-
          mvn --batch-mode --no-transfer-progress -Prelease deploy
          -Dschema.test.jdbc.url=jdbc:postgresql://localhost:5432/schema_applier_test
          -Dschema.test.jdbc.user=postgres
          -Dschema.test.jdbc.password=postgres
          -Dschema.test.mariadb.jdbc.url=jdbc:mariadb://localhost:3306/schema_synchronizer_test
          -Dschema.test.mariadb.jdbc.user=schema_sync
          -Dschema.test.mariadb.jdbc.password=schema_sync
          -Dschema.test.mysql.jdbc.url=jdbc:mysql://localhost:3307/schema_synchronizer_test
          -Dschema.test.mysql.jdbc.user=schema_sync
          -Dschema.test.mysql.jdbc.password=schema_sync
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
