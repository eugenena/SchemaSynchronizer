name: Publish Maven package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish (for example 0.2.0)
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schema_applier_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schema_applier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="${GITHUB_REF_NAME#v}"
      - name: Set requested version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="$RELEASE_VERSION"
      - name: Verify and publish
        run: >-
          mvn --batch-mode --no-transfer-progress deploy
          -Dschema.test.jdbc.url=jdbc:postgresql://localhost:5432/schema_applier_test
          -Dschema.test.jdbc.user=postgres
          -Dschema.test.jdbc.password=postgres
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
