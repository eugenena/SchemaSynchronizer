name: Publish to Maven Central

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  oracle-verify:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: schema_sync
          APP_USER_PASSWORD: schema_sync
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 20s
          --health-timeout 10s
          --health-retries 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Grant DBMS_LOCK to app user
        run: |
          docker exec $(docker ps -q --filter ancestor=gvenzl/oracle-xe:21-slim-faststart) \
            bash -lc "echo \"GRANT EXECUTE ON DBMS_LOCK TO schema_sync;\" | sqlplus -s 'sys/oracle@XEPDB1 as sysdba'"
      - name: Oracle dialect integration tests
        run: >-
          mvn --batch-mode --no-transfer-progress -pl schema-synchronizer test
          -Dtest=SchemaSynchronizerOracleIntegrationTest
          -Dschema.test.oracle.jdbc.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
          -Dschema.test.oracle.jdbc.user=schema_sync
          -Dschema.test.oracle.jdbc.password=schema_sync
          -Dschema.test.oracle.jdbc.schema=schema_sync

  publish:
    needs: [oracle-verify]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schema_applier_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schema_applier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: schema_synchronizer_test
          MARIADB_USER: schema_sync
          MARIADB_PASSWORD: schema_sync
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: schema_synchronizer_test
          MYSQL_USER: schema_sync
          MYSQL_PASSWORD: schema_sync
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Schema_Sync_Test_1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 40s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Verify tag matches Maven version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          test "${RELEASE_VERSION#v}" = "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Verify and publish
        run: >-
          mvn --batch-mode --no-transfer-progress -Prelease deploy
          -Dschema.test.jdbc.url=jdbc:postgresql://localhost:5432/schema_applier_test
          -Dschema.test.jdbc.user=postgres
          -Dschema.test.jdbc.password=postgres
          -Dschema.test.mariadb.jdbc.url=jdbc:mariadb://localhost:3306/schema_synchronizer_test
          -Dschema.test.mariadb.jdbc.user=schema_sync
          -Dschema.test.mariadb.jdbc.password=schema_sync
          -Dschema.test.mysql.jdbc.url=jdbc:mysql://localhost:3307/schema_synchronizer_test
          -Dschema.test.mysql.jdbc.user=schema_sync
          -Dschema.test.mysql.jdbc.password=schema_sync
          -Dschema.test.sqlserver.jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=false;trustServerCertificate=true
          -Dschema.test.sqlserver.jdbc.user=sa
          -Dschema.test.sqlserver.jdbc.password=Schema_Sync_Test_1
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
