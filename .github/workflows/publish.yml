name: Publish to Maven Central

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Secrets (environment "maven-central"; restrict the environment to v* tags and require a reviewer):
#   CENTRAL_USERNAME / CENTRAL_PASSWORD  Sonatype Central Portal user token
#   GPG_PRIVATE_KEY                      ASCII-armored release signing key
#   GPG_PASSPHRASE                       passphrase for GPG_PRIVATE_KEY
#   MAVEN_GPG_KEY_FINGERPRINT            full 40-hex fingerprint of the release key; the build signs
#                                        only with this key (maven-gpg-plugin keyname)

jobs:
  tag-on-main:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be an ancestor of origin/main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is not on main; refusing to publish"
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify tag matches Maven version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          test "${RELEASE_VERSION#v}" = "$(mvn --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)"

  # Same gate as pull requests: unit tests on JDK 17/21, release artifacts + license payload,
  # all five engines with schema.test.require.live=true, and the engine version floors.
  verify:
    needs: [tag-on-main]
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [tag-on-main, verify]
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.MAVEN_GPG_KEY_FINGERPRINT }}
        run: |
          test -n "$MAVEN_GPG_KEY_FINGERPRINT" || { echo "::error::MAVEN_GPG_KEY_FINGERPRINT secret is not set"; exit 1; }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$MAVEN_GPG_KEY_FINGERPRINT" >/dev/null \
            || { echo "::error::Imported key does not contain MAVEN_GPG_KEY_FINGERPRINT"; exit 1; }
      - name: Build release artifacts
        run: mvn --batch-mode --no-transfer-progress -Prelease -Dgpg.skip=true -DskipTests package
      - name: Check standalone jar license payload
        run: scripts/check-standalone-licenses.sh
      - name: Sign and publish (tests ran in the verify job for this commit)
        run: mvn --batch-mode --no-transfer-progress -Prelease -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.MAVEN_GPG_KEY_FINGERPRINT }}
