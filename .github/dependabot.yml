version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      jdbc-drivers:
        patterns:
          - "org.postgresql:*"
          - "org.mariadb.jdbc:*"
          - "com.mysql:*"
          - "com.microsoft.sqlserver:*"
          - "com.oracle.database.jdbc:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.sonatype.central:*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
