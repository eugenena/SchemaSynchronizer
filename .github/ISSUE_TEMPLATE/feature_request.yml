name: Feature request
description: Propose a focused capability or database-dialect improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What adoption or operational problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired API, schema-format, CLI, or dialect behavior.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core synchronization
        - Spring Boot integration
        - CLI
        - PostgreSQL
        - MariaDB
        - MySQL-compatible database
        - New database dialect
        - Documentation
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Could this alter data, weaken fail-closed behavior, or affect retry and locking semantics?
